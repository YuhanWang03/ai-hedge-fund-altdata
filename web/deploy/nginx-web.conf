# AI Hedge Fund Web — nginx site.
# Serves the built React bundle and reverse-proxies /api to the FastAPI
# backend on 127.0.0.1:8100.
#
# Install:
#   sudo cp web/deploy/nginx-web.conf /etc/nginx/sites-available/hedge-fund-web.conf
#   sudo ln -sf /etc/nginx/sites-available/hedge-fund-web.conf /etc/nginx/sites-enabled/
#   # disable the frozen old dashboard site if it was enabled:
#   sudo rm -f /etc/nginx/sites-enabled/dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hedge-fund-web;
    index index.html;

    # SPA fallback — any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → FastAPI backend. explain_move can take 30-45s (Tavily + DeepSeek),
    # so give the upstream a generous read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
