name: agent-v2-gate

on:
  push:
    branches: [main]
    paths: ["v2/agent_v2/**", "v2/agent/**", "v2/sec/eight_k_parser.py", "v2/earnings/calendar.py", "scripts/agent_v2_gate.py", ".github/workflows/agent-v2-gate.yml"]
  pull_request:
    paths: ["v2/agent_v2/**", "v2/agent/**", "v2/sec/eight_k_parser.py", "v2/earnings/calendar.py", "scripts/agent_v2_gate.py", ".github/workflows/agent-v2-gate.yml"]

jobs:
  offline:
    # The Agent V2 unit tests and the offline evaluation import nothing beyond
    # pytest and python-dotenv (the model is scripted, data sources are stubbed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install "pytest>=7" "python-dotenv==1.0.0"
      - run: python scripts/agent_v2_gate.py
